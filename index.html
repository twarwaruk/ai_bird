<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floppy Jacob</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Load Jacob head image to replace the bird
        const jacobImg = new Image();
        jacobImg.src = 'Jacob_head.png';
        let jacobImgLoaded = false;
        jacobImg.onload = () => { jacobImgLoaded = true; };

        // Dynamic canvas sizing
        let CANVAS_WIDTH, CANVAS_HEIGHT;

        // Scaling factor relative to original 400x600 design
        let SCALE;

        // Game constants (will be recalculated on resize)
        let GRAVITY, FLAP_STRENGTH, PIPE_WIDTH, PIPE_GAP, PIPE_SPEED;
        let PIPE_SPAWN_INTERVAL, BIRD_SIZE, GROUND_HEIGHT;

        // Landscape elements
        let trees = [];
        let distantTrees = [];
        let treeOffset = 0;
        let distantTreeOffset = 0;

        function resizeCanvas() {
            CANVAS_WIDTH = window.innerWidth;
            CANVAS_HEIGHT = window.innerHeight;
            canvas.width = CANVAS_WIDTH;
            canvas.height = CANVAS_HEIGHT;

            const scaleX = CANVAS_WIDTH / 400;
            const scaleY = CANVAS_HEIGHT / 600;
            SCALE = Math.min(scaleX, scaleY);

            // Recalculate game constants based on scale
            PIPE_WIDTH = 60 * SCALE;
            BIRD_SIZE = 28 * SCALE;
            GROUND_HEIGHT = 100 * SCALE;
            applyDifficulty();

            // Regenerate landscape elements
            initTrees();

            // Reposition clouds for new dimensions
            if (clouds && clouds.length > 0) {
                for (const cloud of clouds) {
                    cloud.width = (60 + Math.random() * 80) * SCALE;
                    cloud.x = Math.random() * CANVAS_WIDTH;
                    cloud.y = 20 * SCALE + Math.random() * 100 * SCALE;
                }
            }
        }

        function initTrees() {
            // Distant small trees (parallax layer)
            distantTrees = [];
            const distantSpacing = 40 * SCALE;
            for (let x = 0; x < CANVAS_WIDTH + distantSpacing * 2; x += distantSpacing) {
                distantTrees.push({
                    x: x,
                    height: (25 + Math.random() * 35) * SCALE,
                    width: (12 + Math.random() * 10) * SCALE,
                });
            }
            // Foreground trees
            trees = [];
            const spacing = 60 * SCALE;
            for (let x = 0; x < CANVAS_WIDTH + spacing * 2; x += spacing) {
                trees.push({
                    x: x,
                    height: (50 + Math.random() * 60) * SCALE,
                    width: (18 + Math.random() * 14) * SCALE,
                });
            }
        }

        // Difficulty system (1-5, default 4)
        let difficulty = parseInt(localStorage.getItem('floppyDifficulty')) || 4;
        const DIFFICULTY_SETTINGS = {
            1: { gravity: 0.22, flap: -4.8, gap: 190, speed: 1.8, spawn: 2400, label: 'Very Easy' },
            2: { gravity: 0.26, flap: -5.2, gap: 175, speed: 2.1, spawn: 2100, label: 'Easy' },
            3: { gravity: 0.29, flap: -5.5, gap: 162, speed: 2.3, spawn: 1950, label: 'Medium' },
            4: { gravity: 0.32, flap: -5.8, gap: 150, speed: 2.5, spawn: 1800, label: 'Hard' },
            5: { gravity: 0.38, flap: -6.5, gap: 130, speed: 3.0, spawn: 1500, label: 'Insane' },
        };

        // Hit areas for difficulty arrows (set during draw)
        let diffArrowLeft = { x: 0, y: 0, w: 0, h: 0 };
        let diffArrowRight = { x: 0, y: 0, w: 0, h: 0 };

        function applyDifficulty() {
            const s = DIFFICULTY_SETTINGS[difficulty];
            GRAVITY = s.gravity * SCALE;
            FLAP_STRENGTH = s.flap * SCALE;
            PIPE_GAP = s.gap * SCALE;
            PIPE_SPEED = s.speed * SCALE;
            PIPE_SPAWN_INTERVAL = s.spawn;
        }

        function changeDifficulty(delta) {
            difficulty = Math.max(1, Math.min(5, difficulty + delta));
            localStorage.setItem('floppyDifficulty', difficulty);
            bestScore = bestScores[difficulty] || 0;
            applyDifficulty();
        }

        // Game state
        let gameState = 'menu';
        let bird, pipes, score, lastPipeSpawn, groundOffset, frameCount;
        let gameStartTime = 0;
        let gameDuration = 0;

        // Load best scores per difficulty level
        let bestScores = {};
        try {
            bestScores = JSON.parse(localStorage.getItem('floppyBestScores')) || {};
        } catch(e) { bestScores = {}; }
        // Ensure all levels have a value
        for (let i = 1; i <= 5; i++) {
            if (!bestScores[i]) bestScores[i] = 0;
        }
        // Migrate old single best score if it exists
        const oldBest = parseInt(localStorage.getItem('flappyBestScore')) || 0;
        if (oldBest > 0 && bestScores[4] === 0) {
            bestScores[4] = oldBest;
            localStorage.setItem('floppyBestScores', JSON.stringify(bestScores));
        }
        let bestScore = bestScores[difficulty] || 0;

        // Flagstaff Arizona Colors
        const COLORS = {
            skyTop: '#1a5276',
            skyMid: '#2e86c1',
            skyBottom: '#85c1e9',
            sunGlow: '#f9e79f',
            mountainFar: '#7d8a96',
            mountainFarSnow: '#ecf0f1',
            mountainMid: '#5d6d7e',
            mountainMidSnow: '#d5dbdb',
            mountainNear: '#4a5568',
            hillFar: '#6b7b3a',
            hillNear: '#556b2f',
            treeTrunk: '#4a3728',
            treeDark: '#2d4a1e',
            treeMid: '#3a5f2a',
            treeLight: '#4a7a35',
            treeDistant: '#4a6e3a',
            ground: '#c4956a',
            groundDark: '#a0714e',
            groundRed: '#b5654a',
            groundLine: '#8b6914',
            dirtLight: '#d4a574',
            dirtDark: '#96643a',
            rockLight: '#8e8e8e',
            rockMid: '#6b6b6b',
            rockDark: '#4a4a4a',
            rockBrown: '#6b5b4a',
            rockHighlight: '#a0a0a0',
            stalactiteLight: '#9e9585',
            stalactiteMid: '#7a7060',
            stalactiteDark: '#5a5040',
            textWhite: '#ffffff',
            textShadow: '#000000',
            medal_gold: '#ffd700',
            medal_silver: '#c0c0c0',
            medal_bronze: '#cd7f32',
            birdBody: '#f9c74f',
        };

        // Cloud system
        let clouds = [];

        function initClouds() {
            clouds = [];
            for (let i = 0; i < 6; i++) {
                clouds.push({
                    x: Math.random() * CANVAS_WIDTH,
                    y: 20 * SCALE + Math.random() * 100 * SCALE,
                    width: (60 + Math.random() * 80) * SCALE,
                    speed: (0.15 + Math.random() * 0.25) * SCALE,
                    opacity: 0.3 + Math.random() * 0.3
                });
            }
        }

        function resetGame() {
            bird = {
                x: 80 * SCALE,
                y: CANVAS_HEIGHT / 2,
                velocity: 0,
                rotation: 0,
                flapFrame: 0,
                flapTimer: 0
            };
            pipes = [];
            score = 0;
            lastPipeSpawn = 0;
            groundOffset = 0;
            frameCount = 0;
        }

        function flap() {
            if (gameState === 'menu') {
                gameState = 'playing';
                resetGame();
                gameStartTime = Date.now();
                bird.velocity = FLAP_STRENGTH;
                bird.flapFrame = 1;
                bird.flapTimer = 8;
                lastPipeSpawn = Date.now();
            } else if (gameState === 'playing') {
                bird.velocity = FLAP_STRENGTH;
                bird.flapFrame = 1;
                bird.flapTimer = 8;
            } else if (gameState === 'gameover') {
                if (frameCount > 30) {
                    gameState = 'menu';
                }
            }
        }

        // Helper: check if point is inside a rect
        function pointInRect(px, py, rect) {
            return px >= rect.x && px <= rect.x + rect.w && py >= rect.y && py <= rect.y + rect.h;
        }

        // Handle click/tap with difficulty arrow detection
        function handleClick(clientX, clientY) {
            // Convert to canvas coordinates
            const rect = canvas.getBoundingClientRect();
            const scaleFactorX = canvas.width / rect.width;
            const scaleFactorY = canvas.height / rect.height;
            const cx = (clientX - rect.left) * scaleFactorX;
            const cy = (clientY - rect.top) * scaleFactorY;

            if (gameState === 'menu') {
                // Check difficulty arrows first
                if (pointInRect(cx, cy, diffArrowLeft)) {
                    changeDifficulty(-1);
                    return; // Don't start game
                }
                if (pointInRect(cx, cy, diffArrowRight)) {
                    changeDifficulty(1);
                    return; // Don't start game
                }
            }
            flap();
        }

        // Input handling
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Escape') {
                e.preventDefault();
                if (gameState === 'playing' || gameState === 'gameover') {
                    gameState = 'menu';
                }
                return;
            }
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                flap();
            }
            if (gameState === 'menu') {
                if (e.code === 'ArrowLeft') {
                    e.preventDefault();
                    changeDifficulty(-1);
                }
                if (e.code === 'ArrowRight') {
                    e.preventDefault();
                    changeDifficulty(1);
                }
            }
        });
        canvas.addEventListener('click', (e) => {
            handleClick(e.clientX, e.clientY);
        });
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            handleClick(touch.clientX, touch.clientY);
        });

        function spawnPipe() {
            const groundY = CANVAS_HEIGHT - GROUND_HEIGHT;
            const minY = 80 * SCALE;
            const maxY = groundY - PIPE_GAP - 60 * SCALE;
            const topHeight = minY + Math.random() * (maxY - minY);
            // Generate decorations for tree trunks
            const topBranches = [];
            const botBranches = [];
            const numTopBranches = 1 + Math.floor(Math.random() * 3);
            const numBotBranches = 1 + Math.floor(Math.random() * 3);
            for (let i = 0; i < numTopBranches; i++) {
                topBranches.push({ y: 0.15 + Math.random() * 0.7, side: Math.random() > 0.5 ? 1 : -1, len: 0.3 + Math.random() * 0.4 });
            }
            for (let i = 0; i < numBotBranches; i++) {
                botBranches.push({ y: 0.15 + Math.random() * 0.7, side: Math.random() > 0.5 ? 1 : -1, len: 0.3 + Math.random() * 0.4 });
            }
            // Knothole and owl placement
            const hasTopHole = Math.random() > 0.4;
            const hasBotHole = Math.random() > 0.4;
            const topHoleY = 0.3 + Math.random() * 0.4;
            const botHoleY = 0.3 + Math.random() * 0.4;
            const hasOwl = Math.random() > 0.5;
            const owlOnTop = Math.random() > 0.5;
            const owlInHole = hasOwl && ((owlOnTop && hasTopHole) || (!owlOnTop && hasBotHole));
            const owlOnBranch = hasOwl && !owlInHole;
            pipes.push({
                x: CANVAS_WIDTH, topHeight, scored: false,
                topBranches, botBranches,
                hasTopHole, hasBotHole, topHoleY, botHoleY,
                hasOwl, owlOnTop, owlInHole, owlOnBranch
            });
        }

        function update() {
            frameCount++;

            if (gameState === 'playing') {
                // Bird physics
                bird.velocity += GRAVITY;
                bird.y += bird.velocity;

                // Bird rotation
                if (bird.velocity < 0) {
                    bird.rotation = Math.max(-25, bird.velocity / SCALE * 3);
                } else {
                    bird.rotation = Math.min(90, bird.rotation + 2.5);
                }

                // Flap animation timer
                if (bird.flapTimer > 0) {
                    bird.flapTimer--;
                    if (bird.flapTimer <= 0) {
                        bird.flapFrame = 0;
                    }
                }

                // Spawn pipes
                if (Date.now() - lastPipeSpawn > PIPE_SPAWN_INTERVAL) {
                    spawnPipe();
                    lastPipeSpawn = Date.now();
                }

                // Update pipes
                for (let i = pipes.length - 1; i >= 0; i--) {
                    pipes[i].x -= PIPE_SPEED;

                    if (!pipes[i].scored && pipes[i].x + PIPE_WIDTH < bird.x) {
                        pipes[i].scored = true;
                        score++;
                    }

                    if (pipes[i].x + PIPE_WIDTH < -10) {
                        pipes.splice(i, 1);
                    }
                }

                // Ground scroll
                groundOffset = (groundOffset + PIPE_SPEED) % (24 * SCALE);
                // Tree parallax scrolling
                treeOffset = (treeOffset + PIPE_SPEED) ;
                distantTreeOffset = (distantTreeOffset + PIPE_SPEED * 0.3);

                // Collision detection
                const birdLeft = bird.x - BIRD_SIZE + 4 * SCALE;
                const birdRight = bird.x + BIRD_SIZE - 4 * SCALE;
                const birdTop = bird.y - BIRD_SIZE + 4 * SCALE;
                const birdBottom = bird.y + BIRD_SIZE - 4 * SCALE;

                const groundY = CANVAS_HEIGHT - GROUND_HEIGHT;
                if (birdBottom > groundY || birdTop < 0) {
                    gameOver();
                    return;
                }

                for (const pipe of pipes) {
                    const pipeLeft = pipe.x;
                    const pipeRight = pipe.x + PIPE_WIDTH;

                    if (birdRight > pipeLeft && birdLeft < pipeRight) {
                        if (birdTop < pipe.topHeight || birdBottom > pipe.topHeight + PIPE_GAP) {
                            gameOver();
                            return;
                        }
                    }
                }
            } else if (gameState === 'menu') {
                bird = bird || { x: CANVAS_WIDTH / 2, y: CANVAS_HEIGHT / 2, velocity: 0, rotation: 0, flapFrame: 0, flapTimer: 0 };
                bird.y = CANVAS_HEIGHT / 2 - 40 * SCALE + Math.sin(frameCount * 0.05) * 15 * SCALE;
                bird.x = CANVAS_WIDTH / 2;
                groundOffset = (groundOffset + 0.5 * SCALE) % (24 * SCALE);
                treeOffset = (treeOffset + 0.5 * SCALE);
                distantTreeOffset = (distantTreeOffset + 0.15 * SCALE);
            }

            // Update clouds
            for (const cloud of clouds) {
                cloud.x -= cloud.speed;
                if (cloud.x + cloud.width < 0) {
                    cloud.x = CANVAS_WIDTH + 10;
                    cloud.y = 20 * SCALE + Math.random() * 100 * SCALE;
                }
            }
        }

        function gameOver() {
            gameState = 'gameover';
            frameCount = 0;
            gameDuration = Math.round((Date.now() - gameStartTime) / 1000);
            if (score > bestScore) {
                bestScore = score;
                bestScores[difficulty] = score;
                localStorage.setItem('floppyBestScores', JSON.stringify(bestScores));
            }
        }

        function formatDuration(sec) {
            const m = Math.floor(sec / 60);
            const s = sec % 60;
            return m > 0 ? `${m}m ${s}s` : `${s}s`;
        }

        // ========== DRAWING FUNCTIONS ==========

        function drawSky() {
            const groundY = CANVAS_HEIGHT - GROUND_HEIGHT;
            const gradient = ctx.createLinearGradient(0, 0, 0, groundY);
            gradient.addColorStop(0, COLORS.skyTop);
            gradient.addColorStop(0.4, COLORS.skyMid);
            gradient.addColorStop(0.85, COLORS.skyBottom);
            gradient.addColorStop(1, '#c9dde8');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, CANVAS_WIDTH, groundY);

            // Subtle sun glow near horizon
            const sunX = CANVAS_WIDTH * 0.75;
            const sunY = groundY * 0.55;
            const sunGrad = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, 150 * SCALE);
            sunGrad.addColorStop(0, 'rgba(249, 231, 159, 0.2)');
            sunGrad.addColorStop(0.5, 'rgba(249, 231, 159, 0.08)');
            sunGrad.addColorStop(1, 'rgba(249, 231, 159, 0)');
            ctx.fillStyle = sunGrad;
            ctx.fillRect(0, 0, CANVAS_WIDTH, groundY);
        }

        function drawClouds() {
            for (const cloud of clouds) {
                ctx.fillStyle = `rgba(255, 255, 255, ${cloud.opacity})`;
                ctx.beginPath();
                const w = cloud.width;
                const h = w * 0.35;
                const cx = cloud.x + w / 2;
                const cy = cloud.y;
                // Use moveTo before each arc to avoid connecting line artifacts
                ctx.moveTo(cx + h * 0.5, cy);
                ctx.arc(cx, cy, h * 0.5, 0, Math.PI * 2);
                ctx.moveTo(cx - w * 0.2 + h * 0.35, cy + h * 0.1);
                ctx.arc(cx - w * 0.2, cy + h * 0.1, h * 0.35, 0, Math.PI * 2);
                ctx.moveTo(cx + w * 0.2 + h * 0.4, cy + h * 0.1);
                ctx.arc(cx + w * 0.2, cy + h * 0.1, h * 0.4, 0, Math.PI * 2);
                ctx.moveTo(cx - w * 0.1 + h * 0.3, cy - h * 0.1);
                ctx.arc(cx - w * 0.1, cy - h * 0.1, h * 0.3, 0, Math.PI * 2);
                ctx.moveTo(cx + w * 0.1 + h * 0.35, cy - h * 0.05);
                ctx.arc(cx + w * 0.1, cy - h * 0.05, h * 0.35, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawMountains() {
            const groundY = CANVAS_HEIGHT - GROUND_HEIGHT;
            const mountainBase = groundY * 0.65;

            // === Far mountain range (San Francisco Peaks) ===
            ctx.fillStyle = COLORS.mountainFar;
            ctx.beginPath();
            ctx.moveTo(0, mountainBase + 40 * SCALE);

            // Main peak cluster
            const peakCenterX = CANVAS_WIDTH * 0.35;
            ctx.lineTo(peakCenterX - 280 * SCALE, mountainBase + 40 * SCALE);
            ctx.lineTo(peakCenterX - 200 * SCALE, mountainBase - 20 * SCALE);
            ctx.lineTo(peakCenterX - 140 * SCALE, mountainBase - 80 * SCALE);
            ctx.lineTo(peakCenterX - 80 * SCALE, mountainBase - 120 * SCALE);
            ctx.lineTo(peakCenterX - 30 * SCALE, mountainBase - 160 * SCALE);
            // Humphreys Peak (tallest)
            ctx.lineTo(peakCenterX, mountainBase - 190 * SCALE);
            ctx.lineTo(peakCenterX + 25 * SCALE, mountainBase - 185 * SCALE);
            ctx.lineTo(peakCenterX + 60 * SCALE, mountainBase - 170 * SCALE);
            // Agassiz Peak
            ctx.lineTo(peakCenterX + 100 * SCALE, mountainBase - 155 * SCALE);
            ctx.lineTo(peakCenterX + 130 * SCALE, mountainBase - 140 * SCALE);
            ctx.lineTo(peakCenterX + 170 * SCALE, mountainBase - 100 * SCALE);
            ctx.lineTo(peakCenterX + 230 * SCALE, mountainBase - 50 * SCALE);
            ctx.lineTo(peakCenterX + 300 * SCALE, mountainBase + 10 * SCALE);
            ctx.lineTo(peakCenterX + 380 * SCALE, mountainBase + 40 * SCALE);

            // Right side smaller peaks
            const rightPeakX = CANVAS_WIDTH * 0.8;
            ctx.lineTo(rightPeakX - 100 * SCALE, mountainBase + 40 * SCALE);
            ctx.lineTo(rightPeakX - 50 * SCALE, mountainBase - 30 * SCALE);
            ctx.lineTo(rightPeakX, mountainBase - 70 * SCALE);
            ctx.lineTo(rightPeakX + 40 * SCALE, mountainBase - 55 * SCALE);
            ctx.lineTo(rightPeakX + 100 * SCALE, mountainBase - 20 * SCALE);
            ctx.lineTo(CANVAS_WIDTH, mountainBase + 30 * SCALE);
            ctx.lineTo(CANVAS_WIDTH, mountainBase + 60 * SCALE);
            ctx.lineTo(0, mountainBase + 60 * SCALE);
            ctx.closePath();
            ctx.fill();

            // Snow caps on the peaks
            ctx.fillStyle = COLORS.mountainFarSnow;
            ctx.globalAlpha = 0.7;
            ctx.beginPath();
            ctx.moveTo(peakCenterX - 30 * SCALE, mountainBase - 160 * SCALE);
            ctx.lineTo(peakCenterX, mountainBase - 190 * SCALE);
            ctx.lineTo(peakCenterX + 25 * SCALE, mountainBase - 185 * SCALE);
            ctx.lineTo(peakCenterX + 60 * SCALE, mountainBase - 170 * SCALE);
            ctx.lineTo(peakCenterX + 40 * SCALE, mountainBase - 150 * SCALE);
            ctx.lineTo(peakCenterX + 10 * SCALE, mountainBase - 145 * SCALE);
            ctx.lineTo(peakCenterX - 15 * SCALE, mountainBase - 148 * SCALE);
            ctx.closePath();
            ctx.fill();

            // Second snow patch
            ctx.beginPath();
            ctx.moveTo(peakCenterX + 85 * SCALE, mountainBase - 155 * SCALE);
            ctx.lineTo(peakCenterX + 100 * SCALE, mountainBase - 155 * SCALE);
            ctx.lineTo(peakCenterX + 130 * SCALE, mountainBase - 140 * SCALE);
            ctx.lineTo(peakCenterX + 115 * SCALE, mountainBase - 130 * SCALE);
            ctx.lineTo(peakCenterX + 90 * SCALE, mountainBase - 138 * SCALE);
            ctx.closePath();
            ctx.fill();
            ctx.globalAlpha = 1;

            // === Mid-range hills (forested foothills) ===
            const hillBase = groundY * 0.78;
            const hillGrad = ctx.createLinearGradient(0, hillBase - 80 * SCALE, 0, hillBase + 20 * SCALE);
            hillGrad.addColorStop(0, COLORS.hillFar);
            hillGrad.addColorStop(1, COLORS.hillNear);
            ctx.fillStyle = hillGrad;
            ctx.beginPath();
            ctx.moveTo(0, hillBase + 20 * SCALE);
            for (let x = 0; x <= CANVAS_WIDTH; x += 30 * SCALE) {
                const hillHeight = Math.sin(x * 0.003 / SCALE) * 35 * SCALE +
                                   Math.sin(x * 0.007 / SCALE + 1) * 20 * SCALE +
                                   Math.sin(x * 0.002 / SCALE + 3) * 25 * SCALE;
                ctx.lineTo(x, hillBase - hillHeight);
            }
            ctx.lineTo(CANVAS_WIDTH, hillBase + 20 * SCALE);
            ctx.closePath();
            ctx.fill();
        }

        function drawPineTree(x, baseY, height, width, color) {
            // Trunk
            ctx.fillStyle = COLORS.treeTrunk;
            const trunkW = width * 0.15;
            const trunkH = height * 0.2;
            ctx.fillRect(x - trunkW / 2, baseY - trunkH, trunkW, trunkH);

            // Ponderosa pine - layered triangles
            const layers = 4;
            for (let i = 0; i < layers; i++) {
                const layerY = baseY - trunkH - (height * 0.8) * (i / layers);
                const layerWidth = width * (1 - i * 0.15);
                const layerHeight = height * 0.35;

                ctx.fillStyle = i % 2 === 0 ? color : COLORS.treeDark;
                ctx.beginPath();
                ctx.moveTo(x, layerY - layerHeight);
                ctx.lineTo(x - layerWidth / 2, layerY);
                ctx.lineTo(x + layerWidth / 2, layerY);
                ctx.closePath();
                ctx.fill();
            }
        }

        function drawDistantTrees() {
            const groundY = CANVAS_HEIGHT - GROUND_HEIGHT;
            const treeBase = groundY * 0.82;
            const spacing = 40 * SCALE;
            const totalWidth = distantTrees.length * spacing;
            const offset = distantTreeOffset % totalWidth;

            ctx.globalAlpha = 0.6;
            for (const tree of distantTrees) {
                let tx = tree.x - offset;
                // Wrap around
                while (tx < -spacing) tx += totalWidth;
                while (tx > CANVAS_WIDTH + spacing) tx -= totalWidth;
                drawPineTree(tx, treeBase, tree.height, tree.width, COLORS.treeDistant);
            }
            ctx.globalAlpha = 1;
        }

        function drawForegroundTrees() {
            const groundY = CANVAS_HEIGHT - GROUND_HEIGHT;
            const treeBase = groundY;
            const spacing = 60 * SCALE;
            const totalWidth = trees.length * spacing;
            const offset = treeOffset % totalWidth;

            for (const tree of trees) {
                let tx = tree.x - offset;
                while (tx < -spacing) tx += totalWidth;
                while (tx > CANVAS_WIDTH + spacing) tx -= totalWidth;
                drawPineTree(tx, treeBase, tree.height, tree.width, COLORS.treeMid);
            }
        }

        function drawGround() {
            const groundY = CANVAS_HEIGHT - GROUND_HEIGHT;
            const stripeWidth = 24 * SCALE;

            // Dirt/grass line at top
            ctx.fillStyle = '#7a8a3a';
            ctx.fillRect(0, groundY, CANVAS_WIDTH, 3 * SCALE);
            ctx.fillStyle = COLORS.groundLine;
            ctx.fillRect(0, groundY + 3 * SCALE, CANVAS_WIDTH, 3 * SCALE);

            // Main ground - Arizona red/brown dirt
            const groundGradient = ctx.createLinearGradient(0, groundY + 6 * SCALE, 0, CANVAS_HEIGHT);
            groundGradient.addColorStop(0, COLORS.dirtLight);
            groundGradient.addColorStop(0.3, COLORS.ground);
            groundGradient.addColorStop(0.7, COLORS.groundRed);
            groundGradient.addColorStop(1, COLORS.groundDark);
            ctx.fillStyle = groundGradient;
            ctx.fillRect(0, groundY + 6 * SCALE, CANVAS_WIDTH, CANVAS_HEIGHT - groundY - 6 * SCALE);

            // Ground texture - scattered rocks/pebbles pattern
            ctx.fillStyle = 'rgba(0,0,0,0.06)';
            for (let x = -groundOffset; x < CANVAS_WIDTH; x += stripeWidth) {
                ctx.fillRect(x, groundY + 6 * SCALE, stripeWidth * 0.4, CANVAS_HEIGHT - groundY - 6 * SCALE);
            }

            // Small rock details
            ctx.fillStyle = 'rgba(120, 80, 50, 0.15)';
            for (let x = -groundOffset * 1.5; x < CANVAS_WIDTH; x += 37 * SCALE) {
                const rockY = groundY + 15 * SCALE + Math.sin(x * 0.1) * 10 * SCALE;
                ctx.beginPath();
                ctx.ellipse(x, rockY, 4 * SCALE, 2.5 * SCALE, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            // Path/trail through the ground
            ctx.fillStyle = 'rgba(150, 120, 80, 0.2)';
            ctx.fillRect(0, groundY + 30 * SCALE, CANVAS_WIDTH, 8 * SCALE);
        }

        function drawTrunkSection(x, y1, y2, w) {
            const h = y2 - y1;
            if (h <= 0) return;
            // Base bark color
            const grad = ctx.createLinearGradient(x, 0, x + w, 0);
            grad.addColorStop(0, '#3a2818');
            grad.addColorStop(0.15, '#5a3f28');
            grad.addColorStop(0.35, '#6b4c30');
            grad.addColorStop(0.5, '#5a3f28');
            grad.addColorStop(0.65, '#6b4c30');
            grad.addColorStop(0.85, '#5a3f28');
            grad.addColorStop(1, '#3a2818');
            ctx.fillStyle = grad;
            ctx.fillRect(x, y1, w, h);

            // Vertical bark ridges (dark grooves)
            const ridgeSpacing = 8 * SCALE;
            ctx.strokeStyle = 'rgba(25, 15, 5, 0.25)';
            ctx.lineWidth = 1.5 * SCALE;
            for (let rx = x + ridgeSpacing; rx < x + w - 2 * SCALE; rx += ridgeSpacing) {
                const wobble = Math.sin(rx * 0.5) * 2 * SCALE;
                ctx.beginPath();
                ctx.moveTo(rx + wobble, y1);
                ctx.lineTo(rx - wobble, y2);
                ctx.stroke();
            }

            // Lighter vertical bark highlights
            ctx.strokeStyle = 'rgba(130, 100, 70, 0.12)';
            ctx.lineWidth = 2 * SCALE;
            for (let rx = x + ridgeSpacing * 0.5; rx < x + w; rx += ridgeSpacing) {
                const wobble = Math.sin(rx * 0.7 + 1) * 1.5 * SCALE;
                ctx.beginPath();
                ctx.moveTo(rx + wobble, y1);
                ctx.lineTo(rx - wobble, y2);
                ctx.stroke();
            }

            // Subtle horizontal ring marks (less prominent)
            ctx.strokeStyle = 'rgba(30, 20, 10, 0.08)';
            ctx.lineWidth = 1 * SCALE;
            for (let ly = y1 + 25 * SCALE; ly < y2; ly += 30 * SCALE) {
                ctx.beginPath();
                ctx.moveTo(x + 2 * SCALE, ly);
                ctx.lineTo(x + w - 2 * SCALE, ly + 1 * SCALE);
                ctx.stroke();
            }

            // Center highlight strip
            ctx.fillStyle = 'rgba(140, 110, 70, 0.1)';
            ctx.fillRect(x + w * 0.35, y1, w * 0.12, h);

            // Dark edges for depth
            ctx.fillStyle = 'rgba(20, 10, 0, 0.15)';
            ctx.fillRect(x, y1, 3 * SCALE, h);
            ctx.fillRect(x + w - 3 * SCALE, y1, 3 * SCALE, h);
        }

        function drawBranch(trunkX, by, side, len, trunkW) {
            const bLen = trunkW * len * 1.5;
            const bW = 5 * SCALE;
            // Branch originates from the edge of the trunk (centered on trunkX + trunkW/2)
            const trunkCenter = trunkX + trunkW / 2;
            const bx = side > 0 ? trunkCenter + trunkW * 0.3 : trunkCenter - trunkW * 0.3;
            ctx.fillStyle = '#4a3020';
            ctx.beginPath();
            ctx.moveTo(bx, by - bW / 2);
            ctx.lineTo(bx + side * bLen, by - bW * 0.3 - 2 * SCALE);
            ctx.lineTo(bx + side * bLen * 0.95, by + bW * 0.3);
            ctx.lineTo(bx, by + bW / 2);
            ctx.closePath();
            ctx.fill();
            // Branch bark detail
            ctx.strokeStyle = 'rgba(25, 15, 5, 0.2)';
            ctx.lineWidth = 1 * SCALE;
            ctx.beginPath();
            ctx.moveTo(bx, by);
            ctx.lineTo(bx + side * bLen * 0.8, by - 1 * SCALE);
            ctx.stroke();
            // Small leaf clusters at tip
            ctx.fillStyle = '#3a5f2a';
            ctx.beginPath();
            ctx.arc(bx + side * bLen, by - 1 * SCALE, 5 * SCALE, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#2d4a1e';
            ctx.beginPath();
            ctx.arc(bx + side * bLen * 0.85, by + 2 * SCALE, 3 * SCALE, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawKnothole(cx, hy, trunkW) {
            ctx.fillStyle = '#1a1008';
            ctx.beginPath();
            ctx.ellipse(cx + trunkW * 0.5, hy, 7 * SCALE, 5 * SCALE, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#2a1a0a';
            ctx.beginPath();
            ctx.ellipse(cx + trunkW * 0.5, hy, 5 * SCALE, 3.5 * SCALE, 0, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawOwl(ox, oy, size) {
            const s = size * SCALE;
            // Body
            ctx.fillStyle = '#8b7355';
            ctx.beginPath();
            ctx.ellipse(ox, oy, s * 0.6, s * 0.8, 0, 0, Math.PI * 2);
            ctx.fill();
            // Head
            ctx.fillStyle = '#9b8365';
            ctx.beginPath();
            ctx.arc(ox, oy - s * 0.6, s * 0.5, 0, Math.PI * 2);
            ctx.fill();
            // Ear tufts
            ctx.fillStyle = '#7a6345';
            ctx.beginPath();
            ctx.moveTo(ox - s * 0.3, oy - s * 0.9);
            ctx.lineTo(ox - s * 0.15, oy - s * 1.2);
            ctx.lineTo(ox - s * 0.05, oy - s * 0.85);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(ox + s * 0.3, oy - s * 0.9);
            ctx.lineTo(ox + s * 0.15, oy - s * 1.2);
            ctx.lineTo(ox + s * 0.05, oy - s * 0.85);
            ctx.fill();
            // Eyes
            ctx.fillStyle = '#ffee88';
            ctx.beginPath();
            ctx.arc(ox - s * 0.18, oy - s * 0.65, s * 0.18, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(ox + s * 0.18, oy - s * 0.65, s * 0.18, 0, Math.PI * 2);
            ctx.fill();
            // Pupils
            ctx.fillStyle = '#111';
            ctx.beginPath();
            ctx.arc(ox - s * 0.18, oy - s * 0.65, s * 0.08, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(ox + s * 0.18, oy - s * 0.65, s * 0.08, 0, Math.PI * 2);
            ctx.fill();
            // Beak
            ctx.fillStyle = '#c8960a';
            ctx.beginPath();
            ctx.moveTo(ox, oy - s * 0.5);
            ctx.lineTo(ox - s * 0.08, oy - s * 0.35);
            ctx.lineTo(ox + s * 0.08, oy - s * 0.35);
            ctx.closePath();
            ctx.fill();
        }

        function drawTreeTrunkObstacle(pipe) {
            const x = pipe.x;
            const topHeight = pipe.topHeight;
            const groundY = CANVAS_HEIGHT - GROUND_HEIGHT;
            const bottomY = topHeight + PIPE_GAP;
            const trunkW = PIPE_WIDTH;
            const cx = x;

            // ====== TOP TRUNK (from ceiling down) ======
            drawTrunkSection(x, 0, topHeight, trunkW);
            // Broken end at bottom of top trunk
            ctx.fillStyle = '#5a4030';
            ctx.beginPath();
            ctx.moveTo(x, topHeight);
            ctx.lineTo(x + trunkW * 0.2, topHeight + 4 * SCALE);
            ctx.lineTo(x + trunkW * 0.5, topHeight - 2 * SCALE);
            ctx.lineTo(x + trunkW * 0.8, topHeight + 3 * SCALE);
            ctx.lineTo(x + trunkW, topHeight);
            ctx.lineTo(x + trunkW, topHeight - 6 * SCALE);
            ctx.lineTo(x, topHeight - 6 * SCALE);
            ctx.closePath();
            ctx.fill();

            // Top branches
            if (pipe.topBranches) {
                for (const b of pipe.topBranches) {
                    const by = topHeight * b.y;
                    drawBranch(x, by, b.side, b.len, trunkW);
                }
            }
            // Top knothole
            if (pipe.hasTopHole) {
                drawKnothole(x, topHeight * pipe.topHoleY, trunkW);
            }

            // ====== BOTTOM TRUNK (from gap down to ground) ======
            drawTrunkSection(x, bottomY, groundY, trunkW);
            // Broken end at top of bottom trunk
            ctx.fillStyle = '#5a4030';
            ctx.beginPath();
            ctx.moveTo(x, bottomY);
            ctx.lineTo(x + trunkW * 0.15, bottomY - 3 * SCALE);
            ctx.lineTo(x + trunkW * 0.45, bottomY + 2 * SCALE);
            ctx.lineTo(x + trunkW * 0.7, bottomY - 4 * SCALE);
            ctx.lineTo(x + trunkW, bottomY);
            ctx.lineTo(x + trunkW, bottomY + 6 * SCALE);
            ctx.lineTo(x, bottomY + 6 * SCALE);
            ctx.closePath();
            ctx.fill();

            // Bottom branches
            if (pipe.botBranches) {
                for (const b of pipe.botBranches) {
                    const botH = groundY - bottomY;
                    const by = bottomY + botH * b.y;
                    drawBranch(x, by, b.side, b.len, trunkW);
                }
            }
            // Bottom knothole
            if (pipe.hasBotHole) {
                const botH = groundY - bottomY;
                drawKnothole(x, bottomY + botH * pipe.botHoleY, trunkW);
            }

            // Owl
            if (pipe.hasOwl) {
                if (pipe.owlInHole) {
                    // Owl peeking from hole
                    const isTop = pipe.owlOnTop;
                    const holeY = isTop ? topHeight * pipe.topHoleY : bottomY + (groundY - bottomY) * pipe.botHoleY;
                    drawOwl(x + trunkW * 0.5, holeY - 2 * SCALE, 5);
                } else if (pipe.owlOnBranch) {
                    // Owl sitting on a branch
                    const isTop = pipe.owlOnTop;
                    const branches = isTop ? pipe.topBranches : pipe.botBranches;
                    if (branches && branches.length > 0) {
                        const b = branches[0];
                        const baseH = isTop ? topHeight : (groundY - bottomY);
                        const by = isTop ? baseH * b.y : bottomY + baseH * b.y;
                        const bLen = trunkW * b.len * 1.5;
                        const ox = (b.side > 0 ? x + trunkW / 2 : x - trunkW / 2) + b.side * bLen * 0.6;
                        drawOwl(ox, by - 8 * SCALE, 5);
                    }
                }
            }
        }

        function drawBird(x, y, rotation, flapFrame) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rotation * Math.PI / 180);

            const targetHeight = BIRD_SIZE * 2;

            if (jacobImgLoaded) {
                const aspectRatio = jacobImg.naturalWidth / jacobImg.naturalHeight;
                const drawHeight = targetHeight;
                const drawWidth = drawHeight * aspectRatio;
                ctx.drawImage(jacobImg, -drawWidth / 2, -drawHeight / 2, drawWidth, drawHeight);
            } else {
                ctx.fillStyle = COLORS.birdBody;
                ctx.beginPath();
                ctx.arc(0, 0, BIRD_SIZE, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }

        function drawScore() {
            if (gameState === 'playing') {
                ctx.save();
                // Main score at top
                const fontSize = Math.round(48 * SCALE);
                ctx.font = `bold ${fontSize}px Arial`;
                ctx.textAlign = 'center';
                ctx.lineWidth = 4 * SCALE;
                ctx.strokeStyle = COLORS.textShadow;
                ctx.fillStyle = COLORS.textWhite;
                ctx.strokeText(score, CANVAS_WIDTH / 2, 60 * SCALE);
                ctx.fillText(score, CANVAS_WIDTH / 2, 60 * SCALE);

                // Difficulty & best score at bottom
                const groundY = CANVAS_HEIGHT - GROUND_HEIGHT;
                const infoSize = Math.round(13 * SCALE);
                ctx.font = `bold ${infoSize}px Arial`;
                ctx.textAlign = 'center';
                ctx.globalAlpha = 0.6;
                ctx.lineWidth = 2 * SCALE;
                const diffLabel = DIFFICULTY_SETTINGS[difficulty].label;
                const infoText = `Lvl ${difficulty} (${diffLabel})  |  Best: ${bestScore}`;
                ctx.strokeStyle = COLORS.textShadow;
                ctx.strokeText(infoText, CANVAS_WIDTH / 2, groundY - 8 * SCALE);
                ctx.fillStyle = COLORS.textWhite;
                ctx.fillText(infoText, CANVAS_WIDTH / 2, groundY - 8 * SCALE);
                ctx.globalAlpha = 1;

                ctx.restore();
            }
        }

        function drawMenu() {
            ctx.save();

            const titleSize = Math.round(50 * SCALE);
            ctx.font = `bold ${titleSize}px Arial`;
            ctx.textAlign = 'center';
            ctx.lineWidth = 5 * SCALE;
            ctx.strokeStyle = COLORS.textShadow;
            ctx.fillStyle = COLORS.textWhite;

            const titleY = CANVAS_HEIGHT * 0.23;
            ctx.strokeText('Floppy', CANVAS_WIDTH / 2, titleY);
            ctx.fillText('Floppy', CANVAS_WIDTH / 2, titleY);
            ctx.strokeText('Jacob', CANVAS_WIDTH / 2, titleY + 55 * SCALE);
            ctx.fillText('Jacob', CANVAS_WIDTH / 2, titleY + 55 * SCALE);

            // Title color overlay
            ctx.fillStyle = '#e8a838';
            ctx.fillText('Floppy', CANVAS_WIDTH / 2, titleY);
            ctx.fillStyle = '#cd7f32';
            ctx.fillText('Jacob', CANVAS_WIDTH / 2, titleY + 55 * SCALE);

            // Instruction
            const alpha = 0.5 + 0.5 * Math.sin(frameCount * 0.08);
            ctx.globalAlpha = alpha;
            const instrSize = Math.round(22 * SCALE);
            ctx.font = `bold ${instrSize}px Arial`;
            ctx.fillStyle = COLORS.textWhite;
            ctx.strokeStyle = COLORS.textShadow;
            ctx.lineWidth = 3 * SCALE;
            ctx.strokeText('Click or Press Space', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 + 80 * SCALE);
            ctx.fillText('Click or Press Space', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 + 80 * SCALE);
            ctx.globalAlpha = 1;

            // === Difficulty selector ===
            const diffY = CANVAS_HEIGHT / 2 + 115 * SCALE;
            const diffFontSize = Math.round(18 * SCALE);
            const arrowSize = Math.round(28 * SCALE);
            const btnW = 44 * SCALE;
            const btnH = 38 * SCALE;

            // Difficulty label text
            ctx.font = `bold ${diffFontSize}px Arial`;
            ctx.fillStyle = 'rgba(255,255,255,0.7)';
            ctx.strokeStyle = COLORS.textShadow;
            ctx.lineWidth = 2 * SCALE;
            ctx.textAlign = 'center';
            const diffLabel = DIFFICULTY_SETTINGS[difficulty].label;
            const diffText = `Difficulty: ${difficulty} - ${diffLabel}`;
            ctx.strokeText(diffText, CANVAS_WIDTH / 2, diffY);
            ctx.fillText(diffText, CANVAS_WIDTH / 2, diffY);

            // Measure text width to position arrows beside it
            const textWidth = ctx.measureText(diffText).width;
            const arrowGap = 12 * SCALE; // gap between text edge and arrow button

            // Left arrow button  ◀  (same vertical line as text)
            const leftBtnX = CANVAS_WIDTH / 2 - textWidth / 2 - arrowGap - btnW;
            const leftBtnY = diffY - btnH * 0.75;
            ctx.fillStyle = difficulty > 1 ? 'rgba(255,255,255,0.2)' : 'rgba(255,255,255,0.07)';
            ctx.beginPath();
            ctx.roundRect(leftBtnX, leftBtnY, btnW, btnH, 6 * SCALE);
            ctx.fill();
            ctx.font = `bold ${arrowSize}px Arial`;
            ctx.fillStyle = difficulty > 1 ? '#ffffff' : 'rgba(255,255,255,0.3)';
            ctx.textAlign = 'center';
            ctx.fillText('◀', leftBtnX + btnW / 2, leftBtnY + btnH * 0.72);
            diffArrowLeft = { x: leftBtnX, y: leftBtnY, w: btnW, h: btnH };

            // Right arrow button  ▶  (same vertical line as text)
            const rightBtnX = CANVAS_WIDTH / 2 + textWidth / 2 + arrowGap;
            const rightBtnY = diffY - btnH * 0.75;
            ctx.fillStyle = difficulty < 5 ? 'rgba(255,255,255,0.2)' : 'rgba(255,255,255,0.07)';
            ctx.beginPath();
            ctx.roundRect(rightBtnX, rightBtnY, btnW, btnH, 6 * SCALE);
            ctx.fill();
            ctx.font = `bold ${arrowSize}px Arial`;
            ctx.fillStyle = difficulty < 5 ? '#ffffff' : 'rgba(255,255,255,0.3)';
            ctx.textAlign = 'center';
            ctx.fillText('▶', rightBtnX + btnW / 2, rightBtnY + btnH * 0.72);
            diffArrowRight = { x: rightBtnX, y: rightBtnY, w: btnW, h: btnH };

            // === Best Scores per difficulty ===
            const scoreboardY = rightBtnY + btnH + 24 * SCALE;
            const sbFontSize = Math.round(16 * SCALE);
            const lineH = 22 * SCALE;
            const headerSize = Math.round(17 * SCALE);
            ctx.font = `bold ${headerSize}px Arial`;
            ctx.fillStyle = 'rgba(255,255,255,0.75)';
            ctx.strokeStyle = COLORS.textShadow;
            ctx.lineWidth = 3 * SCALE;
            ctx.textAlign = 'center';
            ctx.strokeText('— Best Scores —', CANVAS_WIDTH / 2, scoreboardY);
            ctx.fillText('— Best Scores —', CANVAS_WIDTH / 2, scoreboardY);

            for (let lvl = 5; lvl >= 1; lvl--) {
                const sy = scoreboardY + lineH * (6 - lvl);
                const lbl = DIFFICULTY_SETTINGS[lvl].label;
                const sc = bestScores[lvl] || 0;
                const isCurrent = lvl === difficulty;

                // Use bold for current level, regular bold for others
                ctx.font = isCurrent ? `bold ${sbFontSize}px Arial` : `bold ${sbFontSize}px Arial`;
                ctx.strokeStyle = COLORS.textShadow;
                ctx.lineWidth = 2 * SCALE;

                // Level name on the left
                ctx.textAlign = 'left';
                const colX = CANVAS_WIDTH / 2 - 100 * SCALE;
                const labelText = `${lvl}. ${lbl}`;
                ctx.fillStyle = isCurrent ? '#fffde0' : 'rgba(255,255,255,0.55)';
                ctx.strokeText(labelText, colX, sy);
                ctx.fillText(labelText, colX, sy);

                // Score on the right
                ctx.textAlign = 'right';
                const scoreText = sc > 0 ? String(sc) : '-';
                ctx.fillStyle = isCurrent ? '#fffde0' : 'rgba(255,255,255,0.55)';
                ctx.strokeText(scoreText, CANVAS_WIDTH / 2 + 100 * SCALE, sy);
                ctx.fillText(scoreText, CANVAS_WIDTH / 2 + 100 * SCALE, sy);

                // Highlight bar behind current level
                if (isCurrent) {
                    ctx.fillStyle = 'rgba(255, 255, 200, 0.08)';
                    ctx.fillRect(colX - 5 * SCALE, sy - lineH * 0.7, 210 * SCALE, lineH);
                }
            }

            ctx.restore();
        }

        function drawGameOver() {
            ctx.save();
            const groundY = CANVAS_HEIGHT - GROUND_HEIGHT;
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fillRect(0, 0, CANVAS_WIDTH, groundY);

            const panelW = 320 * SCALE;
            const panelH = 350 * SCALE;
            const panelX = (CANVAS_WIDTH - panelW) / 2;
            const panelY = CANVAS_HEIGHT * 0.12;

            // Panel shadow + bg
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath(); ctx.roundRect(panelX + 4 * SCALE, panelY + 4 * SCALE, panelW, panelH, 12 * SCALE); ctx.fill();
            ctx.fillStyle = '#b5886a';
            ctx.beginPath(); ctx.roundRect(panelX, panelY, panelW, panelH, 12 * SCALE); ctx.fill();
            ctx.fillStyle = '#8b6548';
            ctx.beginPath(); ctx.roundRect(panelX + 8 * SCALE, panelY + 8 * SCALE, panelW - 16 * SCALE, panelH - 16 * SCALE, 8 * SCALE); ctx.fill();
            ctx.fillStyle = '#c9a07a';
            ctx.beginPath(); ctx.roundRect(panelX + 12 * SCALE, panelY + 12 * SCALE, panelW - 24 * SCALE, panelH - 24 * SCALE, 6 * SCALE); ctx.fill();

            // Game Over title
            const goSize = Math.round(38 * SCALE);
            ctx.font = `bold ${goSize}px Arial`;
            ctx.textAlign = 'center';
            ctx.lineWidth = 4 * SCALE;
            ctx.strokeStyle = COLORS.textShadow;
            ctx.fillStyle = '#c0392b';
            ctx.strokeText('Game Over', CANVAS_WIDTH / 2, panelY - 12 * SCALE);
            ctx.fillText('Game Over', CANVAS_WIDTH / 2, panelY - 12 * SCALE);

            // Header: Level + Duration
            const hdrSize = Math.round(14 * SCALE);
            ctx.font = `bold ${hdrSize}px Arial`;
            ctx.fillStyle = '#5a4030';
            ctx.textAlign = 'center';
            const diffLabel = DIFFICULTY_SETTINGS[difficulty].label;
            ctx.fillText(`Level ${difficulty} (${diffLabel})  •  Time: ${formatDuration(gameDuration)}`, CANVAS_WIDTH / 2, panelY + 32 * SCALE);

            // Score
            const labelSize = Math.round(18 * SCALE);
            const numSize = Math.round(32 * SCALE);
            let rowY = panelY + 62 * SCALE;
            ctx.font = `bold ${labelSize}px Arial`;
            ctx.fillStyle = '#3e2a1a';
            ctx.textAlign = 'left';
            ctx.fillText('Score', panelX + 30 * SCALE, rowY);
            ctx.textAlign = 'right';
            ctx.font = `bold ${numSize}px Arial`;
            ctx.fillText(score, panelX + panelW - 30 * SCALE, rowY + 5 * SCALE);

            // Best for this level
            rowY += 45 * SCALE;
            ctx.font = `bold ${labelSize}px Arial`;
            ctx.textAlign = 'left';
            ctx.fillText('Best', panelX + 30 * SCALE, rowY);
            ctx.textAlign = 'right';
            ctx.font = `bold ${numSize}px Arial`;
            ctx.fillText(bestScore, panelX + panelW - 30 * SCALE, rowY + 5 * SCALE);

            if (score === bestScore && score > 0) {
                ctx.font = `bold ${Math.round(13 * SCALE)}px Arial`;
                ctx.fillStyle = '#c0392b';
                ctx.textAlign = 'right';
                ctx.fillText('NEW!', panelX + panelW - 30 * SCALE, rowY - 18 * SCALE);
            }

            // Divider line
            rowY += 25 * SCALE;
            ctx.strokeStyle = 'rgba(62, 42, 26, 0.3)';
            ctx.lineWidth = 1 * SCALE;
            ctx.beginPath();
            ctx.moveTo(panelX + 25 * SCALE, rowY);
            ctx.lineTo(panelX + panelW - 25 * SCALE, rowY);
            ctx.stroke();

            // All Best Scores header
            rowY += 18 * SCALE;
            ctx.font = `bold ${Math.round(14 * SCALE)}px Arial`;
            ctx.fillStyle = '#5a4030';
            ctx.textAlign = 'center';
            ctx.fillText('— All Best Scores —', CANVAS_WIDTH / 2, rowY);

            // Best scores list
            const listSize = Math.round(13 * SCALE);
            const listH = 17 * SCALE;
            ctx.font = `bold ${listSize}px Arial`;
            for (let lvl = 5; lvl >= 1; lvl--) {
                rowY += listH;
                const lbl = DIFFICULTY_SETTINGS[lvl].label;
                const sc = bestScores[lvl] || 0;
                const isCurr = lvl === difficulty;
                ctx.fillStyle = isCurr ? '#3e2a1a' : '#6b5540';
                ctx.textAlign = 'left';
                ctx.fillText(`${lvl}. ${lbl}`, panelX + 35 * SCALE, rowY);
                ctx.textAlign = 'right';
                ctx.fillText(sc > 0 ? String(sc) : '-', panelX + panelW - 35 * SCALE, rowY);
                if (isCurr) {
                    ctx.fillStyle = 'rgba(62, 42, 26, 0.08)';
                    ctx.fillRect(panelX + 25 * SCALE, rowY - listH * 0.7, panelW - 50 * SCALE, listH);
                }
            }

            // Restart instruction
            const alpha = 0.5 + 0.5 * Math.sin(frameCount * 0.08);
            ctx.globalAlpha = alpha;
            const restartSize = Math.round(20 * SCALE);
            ctx.font = `bold ${restartSize}px Arial`;
            ctx.fillStyle = COLORS.textWhite;
            ctx.strokeStyle = COLORS.textShadow;
            ctx.lineWidth = 3 * SCALE;
            ctx.textAlign = 'center';
            ctx.strokeText('Click to Restart', CANVAS_WIDTH / 2, panelY + panelH + 40 * SCALE);
            ctx.fillText('Click to Restart', CANVAS_WIDTH / 2, panelY + panelH + 40 * SCALE);
            ctx.globalAlpha = 1;

            ctx.restore();
        }

        function draw() {
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // Layered Flagstaff landscape
            drawSky();
            drawClouds();
            drawMountains();
            drawDistantTrees();

            // Tree trunk obstacles
            for (const pipe of pipes) {
                drawTreeTrunkObstacle(pipe);
            }

            drawForegroundTrees();
            drawGround();

            // Bird
            if (bird) {
                drawBird(bird.x, bird.y, bird.rotation || 0, bird.flapFrame || 0);
            }

            drawScore();

            if (gameState === 'menu') {
                drawMenu();
            } else if (gameState === 'gameover') {
                drawGameOver();
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            resizeCanvas();
        });

        // Initialize
        resizeCanvas();
        initClouds();
        initTrees();
        resetGame();
        bird.x = CANVAS_WIDTH / 2;
        gameLoop();
    </script>
</body>
</html>
